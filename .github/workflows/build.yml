name: Build Qirtasak APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Qirtasak-App.zip -d extracted
          find extracted -name pubspec.yaml -exec dirname {} \; | head -n 1 > project_path.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          cd "$(cat project_path.txt)"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qirtasak-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
